# A super simple Compose setup.
# This assumes you already have a reverse proxy pointing at
# localhost:8000 which handles SSL termination for HTTPS.
#
# To run this: set the PUBLIC_WEB_ADDRESS and PUBLIC_API_ADDRESS
# environment variables to the public URL of your server. Remember that these
# are full URLs, scheme included, so ensure `https://` is included.
#
# Eigenes Image bauen:  docker compose build
# Starten:              docker compose up
# Nach Code-Änderungen: docker compose build && docker compose up
#
services:
  storyden:
    build:
      context: ../..          # Projekt-Root (wo go.mod liegt)
      dockerfile: docker/api/Dockerfile
    image: storyden-local:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/storyden/data  # SQLite-DB & Assets bleiben erhalten
    environment:
      - PUBLIC_WEB_ADDRESS=${PUBLIC_WEB_ADDRESS:-http://localhost:3000}
      - PUBLIC_API_ADDRESS=${PUBLIC_API_ADDRESS:-http://localhost:8000}
      # E-Mail-Authentifizierung
      # EMAIL_PROVIDER=mock gibt E-Mails (OTP-Codes, Verifizierungslinks) in den Container-Logs aus.
      # Später durch smtp oder sendgrid ersetzen, sobald ein echter Anbieter verfügbar ist.
      - EMAIL_PROVIDER=mock
      # JWT_SECRET wird für das Signieren von E-Mail-Tokens (Passwort-Reset, Verifizierung) benötigt.
      # Diesen Wert geheim halten und NICHT ändern, sobald Benutzer registriert sind.
      - JWT_SECRET=eb2f096fa194d98a4668369e676f4ff6d6270901f261e4bd5fa35ecd2cd9afe4
