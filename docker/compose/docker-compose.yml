# A super simple Compose setup.
# This assumes you already have a reverse proxy pointing at
# localhost:8000 which handles SSL termination for HTTPS.
#
# Eigenes Image bauen:  docker compose build
# Starten:              docker compose up
# Nach Code-Änderungen: docker compose build && docker compose up
#
# Secrets: Kopiere .env.example nach .env und trage deine Werte ein.
# Die .env-Datei wird automatisch von docker compose geladen und ist gitignored.

services:
  storyden:
    build:
      context: ../.. # Projekt-Root (wo go.mod liegt)
      dockerfile: docker/api/Dockerfile
    image: storyden-local:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/storyden/data # SQLite-DB & Assets bleiben erhalten
    environment:
      # --- Adressen ---
      - PUBLIC_WEB_ADDRESS=${PUBLIC_WEB_ADDRESS:-http://localhost:3000}
      - PUBLIC_API_ADDRESS=${PUBLIC_API_ADDRESS:-http://localhost:8000}

      # --- JWT Secret (Pflicht für E-Mail-Auth & OAuth) ---
      - JWT_SECRET=${JWT_SECRET}

      # --- E-Mail (SMTP) ---
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Storyden}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}

      # --- SendGrid (alternativ zu SMTP) ---
      # - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      # - SENDGRID_FROM_ADDRESS=${SENDGRID_FROM_ADDRESS}
      # - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}

      # --- OAuth / SSO ---
      # - OAUTH_GOOGLE_ENABLED=${OAUTH_GOOGLE_ENABLED:-false}
      # - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      # - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      # - OAUTH_GITHUB_ENABLED=${OAUTH_GITHUB_ENABLED:-false}
      # - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID}
      # - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET}
      # - OAUTH_DISCORD_ENABLED=${OAUTH_DISCORD_ENABLED:-false}
      # - OAUTH_DISCORD_CLIENT_ID=${OAUTH_DISCORD_CLIENT_ID}
      # - OAUTH_DISCORD_CLIENT_SECRET=${OAUTH_DISCORD_CLIENT_SECRET}

      # --- Datei-/Asset-Speicher (Standard: lokal) ---
      # - ASSET_STORAGE_TYPE=${ASSET_STORAGE_TYPE:-local}
      # S3-kompatibel (AWS, Cloudflare R2, Minio …):
      # - S3_ENDPOINT=${S3_ENDPOINT}
      # - S3_BUCKET=${S3_BUCKET}
      # - S3_REGION=${S3_REGION}
      # - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      # - S3_SECRET_KEY=${S3_SECRET_KEY}

      # --- Cache (Standard: In-Memory) ---
      # - CACHE_PROVIDER=${CACHE_PROVIDER:-redis}
      # - REDIS_URL=${REDIS_URL}

      # --- Suche (Standard: Datenbank) ---
      # - SEARCH_PROVIDER=${SEARCH_PROVIDER:-bleve}

      # --- SMS / Twilio ---
      # - SMS_PROVIDER=${SMS_PROVIDER}
      # - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      # - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      # - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}

      # --- KI / OpenAI ---
