# A super simple Compose setup.
# This assumes you already have a reverse proxy pointing at
# localhost:8000 which handles SSL termination for HTTPS.
#
# Eigenes Image bauen:  docker compose build
# Starten:              docker compose up
# Nach Code-Änderungen: docker compose build && docker compose up
#
# Secrets: Kopiere .env.example nach .env und trage deine Werte ein.
# Die .env-Datei wird automatisch von docker compose geladen und ist gitignored.
#
# ------------------------------------------------------------------
# Einmalige Migration von SQLite nach PostgreSQL
# ------------------------------------------------------------------
# 1) Backup:      cp -r ./data ./data-backup
# 2) DB starten:  docker compose up -d postgres
# 3) Schema:      DATABASE_URL="postgresql://storyden:PASSWORT@localhost:5432/storyden?sslmode=disable" \
#                   go run ./cmd/migrate
# 4) Probelauf:   go run ./cmd/sqlite2postgres \
#                   --source docker/compose/data/data.db \
#                   --target "postgresql://storyden:PASSWORT@localhost:5432/storyden?sslmode=disable" \
#                   --dry-run
# 5) Echter Lauf: derselbe Befehl ohne --dry-run
# 6) App starten: docker compose up -d --build
#
# Von aussen (Schritt 3-5) laeuft die Verbindung ueber localhost:5432,
# aus dem Container heraus ueber den Servicenamen postgres:5432.
#
# Rollback: DATABASE_URL in .env auskommentieren, dann greift wieder der
# eingebaute SQLite-Default. ./data/data.db bleibt unangetastet.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # Nur an localhost gebunden, nicht öffentlich erreichbar.
      # Wird gebraucht, damit cmd/migrate und cmd/sqlite2postgres vom Host aus
      # verbinden können.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-storyden}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-storyden}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storyden} -d ${POSTGRES_DB:-storyden}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  storyden:
    build:
      context: ../.. # Projekt-Root (wo go.mod liegt)
      dockerfile: docker/api/Dockerfile
    image: storyden-local:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/storyden/data # Assets & Avatare bleiben erhalten
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Adressen ---
      - PUBLIC_WEB_ADDRESS=${PUBLIC_WEB_ADDRESS:-http://localhost:3000}
      - PUBLIC_API_ADDRESS=${PUBLIC_API_ADDRESS:-http://localhost:8000}

      # --- Datenbank ---
      # Ohne diese Variable fällt die App still auf SQLite zurück.
      - DATABASE_URL=${DATABASE_URL}

      # --- JWT Secret (Pflicht für E-Mail-Auth & OAuth) ---
      - JWT_SECRET=${JWT_SECRET}

      # --- E-Mail (SMTP) ---
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Storyden}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}

      # --- SendGrid (alternativ zu SMTP) ---
      # - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      # - SENDGRID_FROM_ADDRESS=${SENDGRID_FROM_ADDRESS}
      # - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}

      # --- OAuth / SSO ---
      # - OAUTH_GOOGLE_ENABLED=${OAUTH_GOOGLE_ENABLED:-false}
      # - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      # - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      # - OAUTH_GITHUB_ENABLED=${OAUTH_GITHUB_ENABLED:-false}
      # - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID}
      # - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET}
      # - OAUTH_DISCORD_ENABLED=${OAUTH_DISCORD_ENABLED:-false}
      # - OAUTH_DISCORD_CLIENT_ID=${OAUTH_DISCORD_CLIENT_ID}
      # - OAUTH_DISCORD_CLIENT_SECRET=${OAUTH_DISCORD_CLIENT_SECRET}

      # --- Datei-/Asset-Speicher (Standard: lokal) ---
      # - ASSET_STORAGE_TYPE=${ASSET_STORAGE_TYPE:-local}
      # S3-kompatibel (AWS, Cloudflare R2, Minio …):
      # - S3_ENDPOINT=${S3_ENDPOINT}
      # - S3_BUCKET=${S3_BUCKET}
      # - S3_REGION=${S3_REGION}
      # - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      # - S3_SECRET_KEY=${S3_SECRET_KEY}

      # --- Cache (Standard: In-Memory) ---
      # - CACHE_PROVIDER=${CACHE_PROVIDER:-redis}
      # - REDIS_URL=${REDIS_URL}

      # --- Suche (Standard: Datenbank) ---
      # - SEARCH_PROVIDER=${SEARCH_PROVIDER:-bleve}

      # --- SMS / Twilio ---
      # - SMS_PROVIDER=${SMS_PROVIDER}
      # - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      # - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      # - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}

      # --- KI / OpenAI ---
      # - LANGUAGE_MODEL_PROVIDER=${LANGUAGE_MODEL_PROVIDER}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - MCP_ENABLED=${MCP_ENABLED:-false}

      # --- Monitoring / Sentry ---
      # - OTEL_PROVIDER=${OTEL_PROVIDER}
      # - SENTRY_DSN=${SENTRY_DSN}

      # --- Logging ---
      # - LOG_LEVEL=${LOG_LEVEL:-info}
      # - LOG_FORMAT=${LOG_FORMAT}

volumes:
  postgres-data:
