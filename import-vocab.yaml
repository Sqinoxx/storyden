# Vokabular fuer den GoogleDrive-Downloads-Import.
#
# renames  laufen einmalig ueber tag_writer.Rename und nehmen bestehende
#          Verknuepfungen mit.
# sections/subjects/types bilden die drei Achsen ab, auf die Ordnernamen
#          normalisiert werden. tag = Tag im Forum, display = Knotenname im
#          Baum, aliases = Schreibweisen wie sie im Quellordner vorkommen.
#
# Zuordnung: exakter Treffer gewinnt, sonst der laengste Alias der im
# Ordnernamen vorkommt. Aliase unter 4 Zeichen greifen nur exakt, deshalb sind
# fuer MKG, KFO, HNO, PPZ, AC, TPK und PRO die Langformen ausgeschrieben.

renames:
  parodondologie: parodontologie
  pharmalogie: pharmakologie
  gedächnisprotokoll: gedächtnisprotokoll

